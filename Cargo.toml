[package]
name = "cal3-rust"
version = "0.1.0"
edition = "2021"
description = "Calendario mensual con notas (port en Rust de cal3.py, solo Linux y Windows)"

[lib]
name = "cal3_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cal3-rust"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.14"
jni = "0.21"
log = "0.4"

[package.metadata.android]
package = "com.carlosfaz.cal3rust"
apk_name = "cal3-rust"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 33

[package.metadata.android.application]
label = "Calendario"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize"
orientation = "unspecified"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"

# winit 0.30 no emite modificadores ni la tecla Atrás útil en Android;
# vendor/winit es una copia con un parche pequeño (ver vendor/winit/PATCH.md).
[patch.crates-io]
winit = { path = "vendor/winit" }
