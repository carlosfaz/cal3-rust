[package]
name = "cal3-rust"
version = "0.1.0"
edition = "2021"
description = "Calendario mensual con notas (port en Rust de cal3.py, solo Linux y Windows)"

[dependencies]
eframe = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
